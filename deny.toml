# cargo-deny: the library is AGPL-3.0-or-later, so every dependency must
# carry a licence that can be combined with it. Run `cargo deny check licenses`.

[graph]
all-features = false

[licenses]
# Permissive and weak-copyleft licences compatible with the AGPL v3, plus
# the GPL v3 / AGPL v3 themselves.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
    "0BSD",
    "GPL-3.0",
    "GPL-3.0-or-later",
    "AGPL-3.0",
    "AGPL-3.0-or-later",
]
confidence-threshold = 0.9
# The list above covers what may appear, not only what does today.
unused-allowed-license = "allow"

# webpki-roots ships Mozilla's list of trusted certificate authorities as
# data under the Community Data License Agreement (Permissive 2.0). It is a
# permissive data licence (keep the notice, no other conditions), so it can
# be combined with the AGPL; it is allowed for this one crate only, rather
# than for everything.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[licenses.private]
# The library itself is not published to crates.io.
ignore = true
