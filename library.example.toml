# The Library — configuration. Copy to library.toml and edit.

# Keep this on localhost and put a reverse proxy with basic auth in front
# (see deploy/Caddyfile).
listen = "127.0.0.1:8080"

# Database, photos, digital copies (in media/), model files and the session
# key live here.
data_dir = "/var/lib/library"

# Shown until you change it on the Librarian's desk (/admin).
default_title = "The Library"

# Run `library hash-password` and paste the line it prints here.
# admin_password_hash = "$argon2id$v=19$..."

# Optional: ask for this password before showing any page (HTTP basic auth,
# any user name). Use it when nothing in front of the library does that.
# site_password = ""

# Hand-drawn art. Defaults to <data_dir>/art. See README for file names.
# art_dir = "/var/lib/library/art"

# Where this program's source code can be had. The library is free software
# under the GNU AGPL: if you change it and let others use it over a network,
# point this at your own changed copy. Linked from every page's footer, the
# Player and Library Rip.
# source_url = "https://github.com/OceanEilonwy/library"

[semantic]
# Meaning-based search with a small local model (~130 MB, CPU only).
enabled = true
model = "BAAI/bge-small-en-v1.5"

[lookup]
# Fill in details from Open Library, Google Books, MusicBrainz, TMDb and a
# barcode database when adding items.
enabled = true
# MusicBrainz asks clients to identify themselves; a URL or email is fine.
# contact = "https://example.org"
# The upload studio's "Fill from MusicBrainz" spaces its requests at least a
# second apart, as MusicBrainz asks (only a local mirror may go faster).
# musicbrainz_interval_ms = 1000
# Film lookups need a free TMDb "API Read Access Token".
# tmdb_token = ""
timeout_secs = 15

[accounts]
# Accounts for the Player (/player/). New accounts start as "child", which
# never sees items marked "Restricted (adults only)"; promote them on the
# Librarian's desk under Accounts, or make them "adult" from the start here.
default_access = "child"
# Let anyone who can reach the site make an account from the Player. Turn it
# off and use `library create-account` instead if you prefer.
open_registration = true

[media]
# Largest single file the upload studio accepts, in megabytes. Remember to
# let big uploads through your reverse proxy too (see deploy/Caddyfile).
max_upload_mb = 20000

[ripper]
# Library Rip builds offered on /ripper ("Get Library Rip"). Copy the files
# from a release (AppImage, .tar.gz, .zip, .dmg) here; the page lists each
# with its size and SHA-256. Defaults to <data_dir>/downloads/library-rip.
# downloads_dir = "/var/lib/library/downloads/library-rip"
