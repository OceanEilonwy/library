# SPDX-License-Identifier: AGPL-3.0-or-later
# cargo-deny for Library Rip: like the library it is AGPL-3.0-or-later, so
# every dependency must carry a licence that can be combined with it. Run
# `cargo deny check licenses` in rip/ (tests/licences.rs does it too).
# The same list as the repository root's deny.toml, plus what the ripper's
# own dependencies need (noted below).

[graph]
all-features = false

[licenses]
# Permissive and weak-copyleft licences compatible with the AGPL v3, plus
# the GPL v3 / AGPL v3 themselves.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
    "0BSD",
    # GPL-3.0-only is allowed for the Slint crates alone (exceptions below).
    "GPL-3.0-or-later",
    "AGPL-3.0",
    "AGPL-3.0-or-later",
]
confidence-threshold = 0.9
# The list above covers what may appear, not only what does today.
unused-allowed-license = "allow"

# webpki-roots ships Mozilla's list of trusted certificate authorities as
# data under the Community Data License Agreement (Permissive 2.0). It is a
# permissive data licence (keep the notice, no other conditions), so it can
# be combined with the AGPL; it is allowed for this one crate only, rather
# than for everything.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

# Slint, used under its GPLv3 option (docs/rip.md): GPL v3 and AGPL v3 code
# may be combined (section 13 of each). GPL-3.0-only is allowed for Slint's
# own crates and nothing else; a new crate needing it must be added here on
# purpose. (Slint's other options, its royalty-free and commercial
# licences, are not used.)
[[licenses.exceptions]]
crate = "slint"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
crate = "slint-build"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
crate = "slint-macros"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
crate = "i-slint-backend-selector"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
crate = "i-slint-backend-winit"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
crate = "i-slint-common"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
crate = "i-slint-compiler"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
crate = "i-slint-core"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
crate = "i-slint-core-macros"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
crate = "i-slint-renderer-femtovg"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
crate = "i-slint-renderer-skia"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
crate = "i-slint-renderer-software"
allow = ["GPL-3.0-only"]

# ksni (the Linux tray support Slint's winit backend pulls in) is released
# under the Unlicense, a public-domain dedication with no conditions.
[[licenses.exceptions]]
crate = "ksni"
allow = ["Unlicense"]

[licenses.private]
# Library Rip itself is not published to crates.io.
ignore = true
